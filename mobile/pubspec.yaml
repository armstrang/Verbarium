name: verbarium
description: Verbarium, kosakata TOEFL & IELTS dengan tangga gelar feodal. Sepenuhnya di perangkat.
publish_to: 'none'
version: 0.3.0+3000

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  collection: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/deck/
    - assets/deck/en/
    - assets/legal/
  fonts:
    - family: Fell
      fonts:
        - asset: assets/fonts/fell-400.ttf
          weight: 400
        - asset: assets/fonts/fell-400i.ttf
          weight: 400
          style: italic
    - family: FellSC
      fonts:
        - asset: assets/fonts/fellsc-400.ttf
          weight: 400
    - family: Alegreya
      fonts:
        - asset: assets/fonts/sans-400.ttf
          weight: 400
        - asset: assets/fonts/sans-400i.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/sans-500.ttf
          weight: 500
        - asset: assets/fonts/sans-700.ttf
          weight: 700
